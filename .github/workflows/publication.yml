name: Publication candidate checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  local-mcp:
    runs-on: windows-latest
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen --extra test --python ${{ matrix.python }}
      - run: uv run --frozen --extra test python -m pytest tests/unit -q
      - run: uv run --frozen --extra test python scripts/export_mcp_manifest.py --check
